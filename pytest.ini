[pytest]
# Pytest configuration for AI Security Gateway
minversion = 9.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    security: Security-related tests
    auth: Authentication tests
    injection: Prompt injection detection tests
    leak: Data leak detection tests
    docker: Docker and containerization tests
    integration: Integration tests
    unit: Unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto

[pytest]
# Pytest configuration for AI Security Gateway
minversion = 9.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    security: Security-related tests
    auth: Authentication tests
    injection: Prompt injection detection tests
    leak: Data leak detection tests
    docker: Docker and containerization tests
    integration: Integration tests
    unit: Unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto


import httpx

try:
    with httpx.Client(verify="certs/ca.crt", cert=("certs/client.crt", "certs/client.key")) as client:
        r = client.post(
            "https://localhost:8443/api/v1/dispatch",
            json={"user_id": "init_test", "prompt": "calculate matrix evaluation"},
            headers={"X-Gateway-Auth-Token": "prod-super-secure-token-991"}
        )
        print(f"Initialization Diagnostic Status: {r.status_code} | Payload: {r.json()}")
except Exception as e:
    print(f"Verification Connection Failed: {e}")


